
<!DOCTYPE html>
<html>
<head>
    <title>Lab 2 - Responsive Layout</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">ShopZone</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#myNavbar">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="myNavbar">

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Shop</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                </ul>

                <a class="nav-link" href="#">Cart 🛒</a>

            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <h3 class="mb-4">Our Products</h3>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+1" alt="Product 1">
                    <h5 class="mt-2">Product 1</h5>
                    <p>Rs. 1200</p>
                </div>
            </div>

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+2" alt="Product 2">
                    <h5 class="mt-2">Product 2</h5>
                    <p>Rs. 1500</p>
                </div>
            </div>

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+3" alt="Product 3">
                    <h5 class="mt-2">Product 3</h5>
                    <p>Rs. 1800</p>
                </div>
            </div>

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+4" alt="Product 4">
                    <h5 class="mt-2">Product 4</h5>
                    <p>Rs. 2000</p>
                </div>
            </div>

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+5" alt="Product 5">
                    <h5 class="mt-2">Product 5</h5>
                    <p>Rs. 1000</p>
                </div>
            </div>

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+6" alt="Product 6">
                    <h5 class="mt-2">Product 6</h5>
                    <p>Rs. 2500</p>
                </div>
            </div>

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+7" alt="Product 7">
                    <h5 class="mt-2">Product 7</h5>
                    <p>Rs. 1700</p>
                </div>
            </div>

            <div class="col">
                <div class="card p-2">
                    <img src="https://placehold.co/400x300?text=Product+8" alt="Product 8">
                    <h5 class="mt-2">Product 8</h5>
                    <p>Rs. 2200</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
